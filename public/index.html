<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer 2.0</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="panel">
        <header>
          <p class="eyebrow">Zoo Engine</p>
          <h1>Viewer 2.0</h1>
          <p class="lede">Execute KCL remotely, export GLB snapshots, and inspect the local ThreeJS scene.</p>
        </header>

        <label>
          API token
          <input id="token" type="password" autocomplete="off" placeholder="zoo API token" />
        </label>

        <div class="grid-2">
          <label>
            API base URL
            <input id="base-url" type="url" placeholder="https://api.zoo.dev" />
          </label>
          <label>
            Engine pool
            <input id="pool" type="text" placeholder="default" />
          </label>
        </div>

        <div class="input-actions">
          <button id="paste" type="button">Paste KCL</button>
          <label class="file-button">
            Open KCL or ZIP
            <input id="file" type="file" accept=".kcl,.zip,text/plain,application/zip" />
          </label>
        </div>

        <label class="kcl-label">
          KCL source
          <textarea id="kcl" spellcheck="false" placeholder="Paste KCL, open a .kcl file, or open a .zip project archive"></textarea>
        </label>

        <fieldset class="export-mode">
          <legend>Export mode</legend>
          <label>
            <input id="export-batch" type="radio" name="export-mode" value="batch" checked />
            <span>Single batch</span>
          </label>
          <label>
            <input id="export-individual" type="radio" name="export-mode" value="individual" />
            <span>Individual</span>
          </label>
          <label>
            <input id="export-random-batches" type="radio" name="export-mode" value="random-batches" />
            <span>Random batches (10)</span>
          </label>
        </fieldset>

        <fieldset class="lighting-options">
          <legend>Lighting</legend>
          <label>
            <input id="lighting-dynamic" type="checkbox" checked />
            Dynamic
          </label>
          <label>
            <input id="lighting-mouse-follow" type="checkbox" />
            Mouse-follow
          </label>
          <span>Neither: static</span>
        </fieldset>

        <fieldset class="viewer-options">
          <legend>Camera</legend>
          <label>
            <input id="frame-first-import" type="checkbox" checked />
            Frame first import
          </label>
          <label>
            <input id="fit-objects-in-view" type="checkbox" checked />
            Fit objects in view
          </label>
        </fieldset>

        <div class="run-row">
          <button id="run" type="button">Execute and Export GLB</button>
          <button id="clear" type="button" class="secondary">Clear Scene</button>
        </div>

        <output id="status" role="status">Idle</output>
      </section>

      <section class="viewer-card">
        <div id="viewer">
          <div id="edge-info" hidden>
            <button id="edge-info-close" type="button" aria-label="Close edge information">&times;</button>
            <input id="edge-uuid" type="text" readonly aria-label="Edge UUID" />
            <button id="edge-uuid-copy" type="button">Copy</button>
          </div>
        </div>
        <aside class="debug-panel">
          <h2>Scene Bodies</h2>
          <ol id="bodies"></ol>
        </aside>
      </section>
    </main>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
