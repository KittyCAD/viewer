<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer 2.0</title>
    <link rel="stylesheet" href="https://use.typekit.net/zzv8rvm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app" class="loader-active">
      <section id="loader-view" class="loader-view" aria-labelledby="loader-title">
        <div class="loader-mark">
          <h1 id="loader-title" class="sr-only">Zoo Viewer</h1>
          <svg class="zoo-logo" viewBox="0 -2 245 84" role="img" aria-label="Zoo">
            <path fill="currentColor" d="M49.1899 14.2024V1.75536H0.0079789V19.3089H44.4824L0.0159578 67.5334H0.0079789V67.5414L0 67.5493L0.0079789 67.5573V79.3501H11.4018L22.8755 66.903V79.3501H72.0574V61.7965H27.591L72.0574 13.5641V1.75536L60.6556 1.77131L49.1899 14.2024Z" />
            <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M116.723 17.5536C103.981 17.5536 93.6164 27.9182 93.6164 40.6605C93.6164 45.751 95.276 50.4665 98.0846 54.2884L86.0205 67.2781C79.8129 60.1369 76.0628 50.8256 76.0628 40.6605C76.0628 18.2398 94.3026 0 116.723 0C125.819 0 134.221 3.00007 141.003 8.06666L128.939 21.0563C125.396 18.8382 121.207 17.5536 116.723 17.5536ZM139.83 40.6605C139.83 35.5699 138.171 30.8544 135.37 27.0245L147.426 14.0349C153.634 21.176 157.384 30.4874 157.384 40.6605C157.384 63.0732 139.144 81.3129 116.723 81.3129C107.627 81.3129 99.2256 78.3129 92.4435 73.2542L104.516 60.2566C108.058 62.4748 112.239 63.7594 116.723 63.7594C129.466 63.7594 139.83 53.3948 139.83 40.6605Z" />
            <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M204.34 17.5536C191.597 17.5536 181.233 27.9182 181.233 40.6605C181.233 45.751 182.892 50.4665 185.701 54.2884L173.637 67.2781C167.429 60.1369 163.679 50.8256 163.679 40.6605C163.679 18.2398 181.919 0 204.34 0C213.435 0 221.837 3.00007 228.619 8.06666L216.555 21.0563C213.013 18.8382 208.824 17.5536 204.34 17.5536ZM222.986 27.0245L235.042 14.0349C241.25 21.176 245 30.4874 245 40.6605C245 63.0732 226.76 81.3129 204.34 81.3129C195.244 81.3129 186.842 78.3129 180.06 73.2542L192.132 60.2566C195.674 62.4748 199.855 63.7594 204.34 63.7594C217.082 63.7594 227.446 53.3948 227.446 40.6605C227.446 35.5699 225.787 30.8544 222.986 27.0245Z" />
          </svg>
          <div class="logo-actions">
            <span class="logo-actions-label">Load from:</span>
            <div class="logo-actions-buttons">
              <div class="loader-action-group">
                <button id="load-project" class="loader-action" type="button" aria-label="Load project" title="Load project">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.75A1.75 1.75 0 0 1 4.75 5h4.06c.47 0 .92.19 1.25.53l1.41 1.47h7.78A1.75 1.75 0 0 1 21 8.75v8.5A1.75 1.75 0 0 1 19.25 19H4.75A1.75 1.75 0 0 1 3 17.25z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" /></svg>
                  <span>Project</span>
                </button>
                <div id="project-sub" class="loader-sub-buttons">
                  <button id="load-project-dir" class="loader-action loader-action-sub" type="button">Directory</button>
                  <button id="load-project-zip" class="loader-action loader-action-sub" type="button">.zip</button>
                </div>
              </div>
              <button id="load-file" class="loader-action" type="button" aria-label="Load KCL file" title="Load KCL file">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 3.75h6.69l4.81 4.81v11.69A1.75 1.75 0 0 1 17.5 22h-9A1.75 1.75 0 0 1 6.75 20.25v-14.75A1.75 1.75 0 0 1 8.5 3.75z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" /><path d="M14.5 3.75V9h5.25" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" /></svg>
                <span>File</span>
              </button>
              <button id="load-clipboard" class="loader-action" type="button" aria-label="Use clipboard contents" title="Use clipboard contents">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.75h6M9.75 3h4.5A1.25 1.25 0 0 1 15.5 4.25v.5A1.25 1.25 0 0 1 14.25 6h-4.5A1.25 1.25 0 0 1 8.5 4.75v-.5A1.25 1.25 0 0 1 9.75 3Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" /><path d="M7.75 5.5h-1A1.75 1.75 0 0 0 5 7.25v11A1.75 1.75 0 0 0 6.75 20h10.5A1.75 1.75 0 0 0 19 18.25v-11a1.75 1.75 0 0 0-1.75-1.75h-1" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" /><path d="M8.4 10h7.2M8.4 13h7.2M8.4 16h4.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.35" /></svg>
                <span>Clipboard</span>
              </button>
            </div>
            <output id="loader-status" class="loader-status" role="status"></output>
          </div>
        </div>
        <input id="loader-file" type="file" accept=".kcl,.zip,text/plain,application/zip" hidden />
        <input id="loader-project" type="file" webkitdirectory hidden />
        <input id="loader-project-zip" type="file" accept=".zip,application/zip" hidden />
      </section>

      <div class="viewer-stage workspace-view">
        <div id="viewer"></div>

        <div class="overlay overlay-top-left">
          <span id="source-label" class="overlay-source">No file loaded</span>
          <select id="file-select" class="overlay-select" aria-label="Active project file" hidden></select>
          <div id="data-pills" class="data-pills" hidden>
            <button id="tab-features" class="data-pill" type="button">Features</button>
            <button id="tab-export" class="data-pill" type="button">Export</button>
            <button id="tab-parameters" class="data-pill" type="button">Parameters</button>
          </div>
          <div id="data-panels" class="data-panels" hidden>
            <div id="features-list" class="data-panel-content" hidden></div>
            <div id="export-panel" class="data-panel-content" hidden>
              <div class="export-title">Export type</div>
              <div id="export-options" class="export-options"></div>
              <div id="export-status" class="export-status"></div>
            </div>
            <section id="parameters-panel" class="parameters-panel data-panel-content" aria-label="KCL parameters" hidden>
              <div class="parameters-header"><span>Parameters</span></div>
              <div id="parameters-list" class="parameters-list"></div>
            </section>
          </div>
        </div>

        <div class="overlay overlay-top-right">
          <div class="status-row">
            <output id="status" class="status-label" role="status">Idle</output>
            <div id="command-indicator" class="command-indicator" hidden>
              <span id="command-dot" class="command-dot"></span>
              <div class="command-track">
                <span id="command-fill" class="command-fill"></span>
              </div>
            </div>
            <button id="disconnect" class="disconnect-btn" type="button" aria-label="Disconnect" title="Disconnect" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6 14 14M14 6 6 14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg>
              <span>Disconnect</span>
            </button>
          </div>
          <button id="edges-toggle" class="snapshot-ctrl-btn" type="button" aria-label="Hide edges" title="Hide edges" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 3.6 4.9 2.8v5.6L10 14.8l-4.9-2.8V6.4Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35"/><path d="M10 3.6v5.6m4.9-2.8L10 9.2 5.1 6.4M10 9.2v5.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35"/></svg>
            <span>Edges</span>
            <input class="button-toggle-check" type="checkbox" tabindex="-1" aria-hidden="true" checked />
          </button>
          <div class="xray-group" hidden id="xray-group">
            <button id="xray-toggle" class="snapshot-ctrl-btn" type="button" aria-label="Toggle xray" title="Xray">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M10 4v12M6.5 6.5l7 7M13.5 6.5l-7 7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.2" opacity=".7"/><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.35"/></svg>
              <span>Xray</span>
              <input class="button-toggle-check" type="checkbox" tabindex="-1" aria-hidden="true" />
            </button>
            <input id="xray-opacity" class="xray-slider" type="range" min="0" max="1" step="0.01" value="0.22" aria-label="Xray opacity" hidden />
          </div>
          <fieldset class="overlay-fieldset">
            <legend>Export</legend>
            <label><input id="export-batch" type="radio" name="export-mode" value="batch" /> Batch</label>
            <label><input id="export-individual" type="radio" name="export-mode" value="individual" /> Individual</label>
            <label><input id="export-random-batches" type="radio" name="export-mode" value="random-batches" checked /> Random</label>
          </fieldset>
          <fieldset class="overlay-fieldset">
            <legend>Lighting</legend>
            <label><input id="lighting-uniform" type="radio" name="lighting" value="uniform" checked /> Uniform</label>
            <label><input id="lighting-dynamic" type="radio" name="lighting" value="dynamic" /> Dynamic</label>
            <label><input id="lighting-mouse-follow" type="radio" name="lighting" value="mouse" /> Mouse</label>
          </fieldset>
          <fieldset class="overlay-fieldset">
            <legend>Camera</legend>
            <label><input id="camera-perspective" type="radio" name="camera-mode" value="perspective" /> Persp</label>
            <label><input id="camera-orthographic" type="radio" name="camera-mode" value="orthographic" checked /> Ortho</label>
            <label><input id="frame-first-import" type="checkbox" checked /> Frame</label>
            <label><input id="fit-objects-in-view" type="checkbox" checked /> Fit</label>
          </fieldset>
        </div>

        <div class="overlay overlay-bottom-left">
          <input id="token" class="overlay-token" type="password" autocomplete="off" placeholder="Zoo API token" />
          <div class="overlay-connection">
            <input id="base-url" class="overlay-input" type="url" placeholder="https://api.zoo.dev" />
            <input id="pool" class="overlay-input" type="text" placeholder="pool" />
          </div>
        </div>

        <!-- Bottom-right: snapshot views dock + controls -->
        <div class="snapshot-area">
          <div id="snapshot-dock" class="snapshot-dock" hidden>
            <div class="snapshot-card" data-view="top">
              <span class="snapshot-label">Top</span>
              <div class="snapshot-frame"><img data-snapshot-img="top" alt="Top view" hidden /><div class="snapshot-empty">No model</div></div>
            </div>
            <div class="snapshot-card" data-view="profile">
              <span class="snapshot-label">Profile</span>
              <div class="snapshot-frame"><img data-snapshot-img="profile" alt="Profile view" hidden /><div class="snapshot-empty">No model</div></div>
            </div>
            <div class="snapshot-card" data-view="front">
              <span class="snapshot-label">Front</span>
              <div class="snapshot-frame"><img data-snapshot-img="front" alt="Front view" hidden /><div class="snapshot-empty">No model</div></div>
            </div>
            <div class="snapshot-card" data-view="isometric">
              <span class="snapshot-label">Iso</span>
              <div class="snapshot-frame"><img data-snapshot-img="isometric" alt="Isometric view" hidden /><div class="snapshot-empty">No model</div></div>
            </div>
          </div>
          <div class="snapshot-controls">
            <button id="photo-toggle" class="snapshot-ctrl-btn" type="button" aria-label="Photo mode" title="Photo" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 6.25A1.25 1.25 0 0 1 5.75 5h1.4l1.1-1.25h3.5L12.85 5h1.4a1.25 1.25 0 0 1 1.25 1.25v7.5A1.25 1.25 0 0 1 14.25 15h-8.5A1.25 1.25 0 0 1 4.5 13.75Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.35"/><circle cx="10" cy="10" r="2.65" fill="none" stroke="currentColor" stroke-width="1.35"/><circle cx="13.55" cy="7.25" r=".55" fill="currentColor"/></svg>
              <span>Photo</span>
              <input class="button-toggle-check" type="checkbox" tabindex="-1" aria-hidden="true" />
            </button>
            <button id="views-toggle" class="snapshot-ctrl-btn" type="button" aria-label="Toggle views" title="Views" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4.25" width="12" height="11.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.35"/><path d="M4 8.1h12M8.1 8.1v7.65M11.9 8.1v7.65" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.2"/></svg>
              <span>Views</span>
              <input class="button-toggle-check" type="checkbox" tabindex="-1" aria-hidden="true" />
            </button>
          </div>
        </div>

        <div id="edge-info" class="edge-info-popup" hidden>
          <button id="edge-info-close" type="button" aria-label="Close UUID information">&times;</button>
          <input id="edge-uuid" type="text" readonly aria-label="Selected UUID" />
          <button id="edge-uuid-copy" type="button">Copy</button>
          <pre id="face-info" class="face-info" hidden></pre>
          <pre id="edge-source" class="edge-source" hidden></pre>
        </div>


      </div>

      <textarea id="kcl" hidden></textarea>
      <ol id="bodies" hidden></ol>
      <label id="file-select-label" hidden></label>
      <button id="run" hidden></button>
      <button id="clear" hidden></button>
      <button id="paste" hidden></button>
      <input id="file" type="file" hidden />
    </main>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
